#
# PUBLISH. Step 3 of 3; see release.yml for the chain.
#
# THIS WORKFLOW BUILDS NOTHING. The shared workflow finds the release.yml run
# that built this tag's artifacts, proves that run produced the tree the tag
# points at, downloads them and publishes. A missing artifact, an expired
# artifact or a tree mismatch fails the publish rather than falling back to a
# build. The single exception is `cargo publish --no-verify`, which has no
# pre-built input; the tree it uploads was compiled by Full and packaged by
# release.yml.
#
# BEFORE THE FIRST TAG, in this order:
#
#   1. Re-point both Trusted Publishers from release.yml to publish.yml. They
#      match on workflow FILENAME, so the split breaks them until updated --
#      and the rehearsal below will NOT catch it, because a rehearsal skips
#      the upload.
#        crates.io  https://crates.io/crates/ara2/settings    (and ara2-sys)
#        PyPI       https://pypi.org/manage/project/edgefirst-ara2/settings/publishing/
#   2. Run the workflow_dispatch rehearsal against a release branch that has a
#      green build. It resolves, verifies and downloads everything and
#      publishes nothing.
#   3. Only then merge the release PR and let the tag fire.
#
# Design: https://au-zone.atlassian.net/wiki/spaces/EAM/pages/2750906369/CICD+Pipelines
#
# Action Versions (hash-pinned):
# - pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 (v1.14.2)
# - EdgeFirstAI/.github@55bc02295af9878e74007b5f9e00fffbffcff62e (v2.1.0)

name: Publish

on:
  push:
    tags: ['v*.*.*']              # vX.Y.Z and vX.Y.Z-rcN
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to rehearse, e.g. v0.18.0 (publishes nothing)'
        required: true
        type: string

concurrency:
  group: publish-${{ github.ref }}
  # No cancel-in-progress. A half-finished publish is not a state anything can
  # recover from: crates.io and PyPI uploads are irreversible.
  cancel-in-progress: false

jobs:
  publish:
    uses: EdgeFirstAI/.github/.github/workflows/publish-rust.yml@55bc02295af9878e74007b5f9e00fffbffcff62e  # v2.1.0
    with:
      tag: ${{ inputs.tag }}
      build-workflow: release.yml
      publish-crates: true
      # Dependency order: ara2 depends on ara2-sys, and crates.io is the one
      # target where a partial publish cannot be undone by re-running the job.
      # ara2-py is `publish = false` -- it ships to PyPI as a wheel, below.
      crate-packages: ara2-sys ara2
    permissions:
      contents: write             # create the GitHub Release
      actions: read               # read the release.yml run and its artifacts
      id-token: write             # OIDC trusted publishing
    secrets: inherit

  # PyPI matches job_workflow_ref in the PUBLISHER repository, so a reusable
  # workflow in EdgeFirstAI/.github cannot be a Trusted Publisher
  # (https://docs.pypi.org/trusted-publishers/troubleshooting/). This job stays
  # here. Re-check pypi/warehouse#11096 / PR 20083; if merged, fold it into
  # publish-rust.yml. A composite action inside the job does not change the
  # claim, so the file selection and version check are still shared.
  publish-pypi:
    needs: publish
    # Runs on a rehearsal too, and only the upload is gated. A rehearsal whose
    # job is skipped proves nothing about the wheels; the point of rehearsing
    # is to discover an empty or wrong wheel set BEFORE the tag, not after the
    # crates have already gone out.
    if: ${{ always() && needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/edgefirst-ara2/
    permissions:
      id-token: write
      contents: read
    steps:
      # Selects edgefirst_ara2-* wheels and sdist by filename, so the .crate
      # files release.yml also stages never reach PyPI, and fails if any file
      # carries a version other than the tag's: a PyPI version is immutable.
      - uses: EdgeFirstAI/.github/.github/actions/stage-pypi@55bc02295af9878e74007b5f9e00fffbffcff62e  # v2.1.0
        with:
          distribution: edgefirst-ara2
          version: ${{ needs.publish.outputs.version }}

      # Directly in the job, never through a composite action: it resolves its
      # own container image from the repository it is called from.
      - name: Upload to PyPI
        # publish-registries, not publishing: it is false for a rehearsal AND
        # for a release candidate whose manifests still carry the base version,
        # where uploading would consume the immutable version the final release
        # needs. The shared workflow decides; this job only obeys.
        if: ${{ needs.publish.outputs.publish-registries == 'true' }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: dist
          # A retry after a partial upload must not fail on the files that
          # already landed.
          skip-existing: true
