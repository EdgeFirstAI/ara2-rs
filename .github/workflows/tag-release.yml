#
# TAG. Step 2 of 3; see release.yml for the chain.
#
# The implementation lives in EdgeFirstAI/.github so it cannot drift between
# repositories. It reads the branch name through `env` rather than
# interpolating it, restricts the version to an anchored
# `X.Y.Z` / `X.Y.Z-rcN` pattern, and creates an annotated tag object through
# git/tags before pointing the ref at it, so `git describe` resolves it.
#
# Design: https://au-zone.atlassian.net/wiki/spaces/EAM/pages/2750906369/CICD+Pipelines
#
# Action Versions (hash-pinned):
# - EdgeFirstAI/.github@41947187ad817514d1843dfd979f629db443c971 (main, 2026-09-18)

name: Tag Release

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  tag:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/')
    uses: EdgeFirstAI/.github/.github/workflows/tag-release.yml@41947187ad817514d1843dfd979f629db443c971  # main (2026-09-18)
    with:
      # No tag unless the release build is green for the exact commit being
      # merged. Branch protection requires ci-gate only, and release.yml runs
      # on a branch push rather than on the PR, so this is the one place
      # "the artifacts exist before the tag does" is actually enforced.
      require-build: release.yml
    secrets: inherit
