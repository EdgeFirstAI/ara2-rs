#
# RELEASE BUILD. Step 1 of 3:
#
#   release.yml      push to release/*.*.*  -> build every artifact  (this file)
#   tag-release.yml  release PR merged      -> annotated vX.Y.Z tag
#   publish.yml      push of a v*.*.* tag   -> publish what was built
#
# A tag deploys; it never builds. A tag-triggered workflow cannot be run by a
# pull request, so anything it builds is built where nothing can test it first.
# Everything below runs on a branch a pull request can see, and accepting the
# release PR is the gate: it cannot merge until this is green, and green means
# every artifact the release ships already exists.
#
# It triggers on `push` rather than `pull_request` because a pull_request run
# builds a merge-preview commit that exists nowhere in history, so publish.yml
# could never bind its artifacts to the tag. A push run builds the branch head,
# which is the commit the release PR merges.
#
# Design: https://au-zone.atlassian.net/wiki/spaces/EAM/pages/2750906369/CICD+Pipelines
#
# Action Versions (hash-pinned):
# - EdgeFirstAI/.github@07b46d78c7ff5034216044a7fc86ec3a37b8cabd (main, 2026-09-18)

name: Release Build

on:
  push:
    branches: ['release/*.*.*']   # release/X.Y.Z and release/X.Y.Z-rcN
  workflow_dispatch:              # rebuild a release branch on demand

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: true        # a fixup commit supersedes the build it interrupts

permissions:
  contents: read

jobs:
  # Version consistency against the branch name -- including the
  # [workspace.dependencies] entries for ara2 and ara2-sys, which carry the
  # release version a second time -- the CHANGELOG section publish.yml turns
  # into release notes, the full SBOM, and the .crate files crates.io receives.
  verify:
    uses: EdgeFirstAI/.github/.github/workflows/release-rust.yml@07b46d78c7ff5034216044a7fc86ec3a37b8cabd  # main (2026-09-18)
    with:
      sbom: true
      # The dependency graph differs by target: the ARA-2 client links G2D and
      # DMA-BUF only on aarch64, so a host-only scan under-reports what ships.
      sbom-targets: aarch64-unknown-linux-gnu
      # Dependency order. publish.yml reads the list this records and refuses
      # to publish a different one, so the two cannot drift. ara2-py is
      # `publish = false`; it ships to PyPI as a wheel, built below.
      crate-packages: ara2-sys ara2
    secrets: inherit

  # manylinux2014 wheels for edgefirst-ara2, x86_64 and aarch64, with the sdist
  # on x86_64 only -- which is the shared workflow's default matrix, so only the
  # manifest needs naming. Linux only: ARA-2 is a PCIe card in an NXP i.MX host,
  # so there is no macOS or Windows target.
  wheels:
    needs: verify
    uses: EdgeFirstAI/.github/.github/workflows/release-wheels.yml@07b46d78c7ff5034216044a7fc86ec3a37b8cabd  # main (2026-09-18)
    with:
      manifest: crates/ara2-py/Cargo.toml
      # maturin infers abi3 from requires-python, so one wheel serves 3.11+.
      # If that inference ever stops holding the build silently produces
      # version-specific wheels and PyPI gains gaps no one notices until an
      # install fails. Assert the tag instead of trusting it: a wheel that
      # fails here never reaches the artifact store.
      post-command: |
        shopt -s nullglob
        found=0
        for whl in target/wheels/*.whl; do
          found=1
          case "$(basename "$whl")" in
            *-cp311-abi3-*) echo "ok  $(basename "$whl")" ;;
            *) echo "::error::$(basename "$whl") is not a cp311-abi3 wheel"; exit 1 ;;
          esac
        done
        [[ "$found" -eq 1 ]] || { echo "::error::no wheels were built"; exit 1; }
    secrets: inherit
