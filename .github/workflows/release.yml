#
# RELEASE BUILD. Step 1 of 3:
#
#   release.yml      push to release/*.*.*  -> build every artifact  (this file)
#   tag-release.yml  release PR merged      -> annotated vX.Y.Z tag
#   publish.yml      push of a v*.*.* tag   -> publish what was built
#
# A tag deploys; it never builds. A tag-triggered workflow cannot be run by a
# pull request, so anything it builds is built where nothing can test it first.
# Everything below runs on a branch a pull request can see, and accepting the
# release PR is the gate: it cannot merge until this is green, and green means
# every artifact the release ships already exists.
#
# It triggers on `push` rather than `pull_request` because a pull_request run
# builds a merge-preview commit that exists nowhere in history, so publish.yml
# could never bind its artifacts to the tag. A push run builds the branch head,
# which is the commit the release PR merges.
#
# Design: https://au-zone.atlassian.net/wiki/spaces/EAM/pages/2750906369/CICD+Pipelines
#
# Action Versions (hash-pinned):
# - actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 (v7.0.1)
# - actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 (v6.2.0)
# - actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a (v7.0.1)
# - dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 (stable)
# - EdgeFirstAI/.github@f86411f9b2c7a2dbd12f65f1d9f233b08084e142 (main, 2026-09-18)

name: Release Build

on:
  push:
    branches: ['release/*.*.*']   # release/X.Y.Z and release/X.Y.Z-rcN
  workflow_dispatch:              # rebuild a release branch on demand

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: true        # a fixup commit supersedes the build it interrupts

permissions:
  contents: read

jobs:
  # Version consistency against the branch name, the CHANGELOG section
  # publish.yml will turn into release notes, and the full scancode SBOM.
  # Fails the release PR rather than the tag.
  verify:
    uses: EdgeFirstAI/.github/.github/workflows/release-rust.yml@f86411f9b2c7a2dbd12f65f1d9f233b08084e142  # main (2026-09-18)
    with:
      sbom: true
      # The dependency graph differs by target: the ARA-2 client links G2D and
      # DMA-BUF only on aarch64, so a host-only scan under-reports what ships.
      sbom-targets: aarch64-unknown-linux-gnu
    secrets: inherit

  # The `.crate` files crates.io will receive. `cargo package --locked` is the
  # step that catches an excluded file, a path dependency without a version or
  # a dirty tree -- the failures that would otherwise surface inside
  # `cargo publish` on the tag. publish.yml then runs `cargo publish
  # --no-verify`, so this is the only place that packaging is exercised.
  package:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7  # stable
        with:
          toolchain: stable

      # Dependency order. `ara2` carries a path+version dependency on
      # `ara2-sys`, so packaging it requires ara2-sys to be packageable first.
      - name: cargo package
        run: |
          set -euo pipefail
          cargo package --locked -p ara2-sys -p ara2
          ls -la target/package/*.crate

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: crates
          path: target/package/*.crate
          if-no-files-found: error
          # The release-PR-to-tag gap is human-paced and publish.yml fails on
          # an expired artifact rather than rebuilding.
          retention-days: 30

  # Wheels for the edgefirst-ara2 package. Linux only: ARA-2 is a PCIe card in
  # an NXP i.MX host, so there is no macOS or Windows target to build for.
  wheels:
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false            # one broken target must not hide the rest
      matrix:
        include:
          - name: x86_64-linux
            runner: ubuntu-24.04
            maturin-args: --sdist --zig --compatibility manylinux2014
          - name: aarch64-linux
            runner: ubuntu-24.04-arm
            maturin-args: --zig --compatibility manylinux2014
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7  # stable
        with:
          toolchain: stable

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.11'

      - name: Install maturin
        run: pip install 'maturin[patchelf,zig]'

      - name: Build wheels
        env:
          MATURIN_ARGS: ${{ matrix.maturin-args }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086  # MATURIN_ARGS is an argument list and must split
          maturin build --release --locked -m crates/ara2-py/Cargo.toml $MATURIN_ARGS
          ls -la target/wheels/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: wheels-${{ matrix.name }}
          path: target/wheels/*
          if-no-files-found: error
          retention-days: 30
