#
# Nightly safety net for anything a reviewer skipped by not labelling `ci:full`.
#
# Design: https://au-zone.atlassian.net/wiki/spaces/EAM/pages/2750906369/CICD+Pipelines
#
# Action Versions (hash-pinned):
# - EdgeFirstAI/.github@55bc02295af9878e74007b5f9e00fffbffcff62e (v2.1.0)

name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Run even if main has not moved since the last nightly.
        type: boolean
        required: false
        default: false

jobs:
  changed:
    uses: EdgeFirstAI/.github/.github/workflows/nightly-gate.yml@55bc02295af9878e74007b5f9e00fffbffcff62e  # v2.1.0
    with:
      # `inputs` is null on a schedule trigger, so the fallback is required;
      # without it the expression yields an empty string and the gate's
      # boolean input rejects it.
      force: ${{ inputs.force || false }}

  # Deliberately not `needs: changed`. cargo audit answers a question about the
  # RustSec database, which changes daily whether this repository does or not,
  # so gating it would go quiet exactly when a new advisory lands against an
  # unchanged main. It reads Cargo.lock without building, on a free standard
  # runner, so running it every night costs nothing.
  advisories:
    uses: EdgeFirstAI/.github/.github/workflows/advisories.yml@55bc02295af9878e74007b5f9e00fffbffcff62e  # v2.1.0

  nightly:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    uses: EdgeFirstAI/.github/.github/workflows/rust-full.yml@55bc02295af9878e74007b5f9e00fffbffcff62e  # v2.1.0
    with:
      lanes: host
      nightly: true
      skip-macos: true
      skip-windows: true
      # The runner selection policy puts Nightly on the larger class: it runs
      # once per labelled PR rather than per push, so the spend is bounded by
      # review cadence. Quick, which does run per push, stays free.
      runner-class-linux: larger
      runner-class-linux-arm: larger
      nextest-args: --workspace --locked -E 'test(dvm_metadata)'
      env: PYO3_CROSS_PYTHON_VERSION=3.11
      hack-args: --feature-powerset --depth 2 --exclude-features camera
    secrets: inherit
