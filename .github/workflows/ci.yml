#
# Tiered CI. Quick runs on every push to a non-draft PR; Full runs only when a
# reviewer asks for it. One required check, `ci-gate`, covers both.
#
# Design: https://au-zone.atlassian.net/wiki/spaces/EAM/pages/2750906369/CICD+Pipelines
#
# Action Versions (hash-pinned):
# - actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 (v7.0.1)
# - dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d (v4.0.3)
# - EdgeFirstAI/.github@68dd89aa7f781e2a26f2fdb6430c6a43368f9063 (main, 2026-09-18)

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        type: boolean
        default: false
      hardware:
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read        # checkout
      pull-requests: read   # paths-filter compares the PR through the API
    outputs:
      code: ${{ steps.f.outputs.code }}
      full: ${{ steps.mode.outputs.full }}
      hardware: ${{ steps.mode.outputs.hardware }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: f
        with:
          filters: |
            code:
              - 'crates/**'
              - 'examples/**'
              - 'tests/**'
              - 'Cargo.*'
              - 'rust-toolchain.toml'
              # The lint configs decide what Quick enforces, so a change to one
              # has to be validated by the lane it configures. Without these a
              # PR touching only ruff.toml skips Quick and merges unchecked.
              - 'ruff.toml'
              - 'rustfmt.toml'
              - '.github/**'
      - id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          DISPATCH_FULL: ${{ inputs.full }}
          DISPATCH_HARDWARE: ${{ inputs.hardware }}
        run: |
          full=false
          hardware=false
          case "$EVENT_NAME" in
            merge_group) full=true ;;
            workflow_dispatch)
              full="$DISPATCH_FULL"
              hardware="$DISPATCH_HARDWARE"
              ;;
          esac
          # Re-run Full on later pushes while the label is still present.
          case ",$LABELS," in *,ci:full,*) full=true ;; esac
          case ",$LABELS," in *,ci:hardware,*) hardware=true ;; esac
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "hardware=$hardware" >> "$GITHUB_OUTPUT"

  quick:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: EdgeFirstAI/.github/.github/workflows/rust-quick.yml@68dd89aa7f781e2a26f2fdb6430c6a43368f9063  # main (2026-09-18)
    # The stock clippy pass covers the default build, where `codec` and
    # `decoder` are off. The cfg-gated arms and the `yolov8` example only exist
    # with them on, and the nightly feature-combination lane is up to a day
    # away -- and does not run on a pull request at all, since rust-full gates
    # it on `nightly`. A second pass is what gives them PR-time signal, which
    # is what the old test.yml's two clippy invocations did.
    with:
      # ruff over the Python bindings package and the Python examples. Lint
      # only -- the bindings need maturin to import, which is Full-tier work.
      python: true
      ruff-paths: crates/ara2-py examples
      # Pinned: ruff's default rule set changes between releases, and uvx
      # would otherwise resolve whatever the runner's cache holds. ruff.toml
      # declares only this repository's exceptions to that set, so the set
      # itself has to be fixed for the file to mean anything.
      ruff-version: 0.16.7
      # pyo3 refuses to configure a cross build without an interpreter for the
      # target, and the cross-clippy lane lints the whole workspace, so ara2-py
      # reaches it. Naming the version is enough; nothing is executed. An abi3
      # feature would also satisfy pyo3, but the wheel's ABI is a packaging
      # decision and must not be made by a linter.
      env: PYO3_CROSS_PYTHON_VERSION=3.11
      # Every other test needs an ARA-2 NPU and the ARA-2 proxy service, which
      # no hosted runner has. They are not #[ignore]d because on a target they
      # are the point of the suite, so the filter lives here.
      clippy-extra-args: >-
        --workspace --all-targets --locked
        --features ara2/codec,ara2/decoder -- -D warnings
      nextest-args: --workspace --locked -E 'test(dvm_metadata)'
      cache-key: quick-x86_64

  full:
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.hardware == 'true'
    uses: EdgeFirstAI/.github/.github/workflows/rust-full.yml@68dd89aa7f781e2a26f2fdb6430c6a43368f9063  # main (2026-09-18)
    with:
      # `lanes: host` and no `boards` input: ARA-2 is a PCIe card in an NXP
      # i.MX host and the fleet has no such runner, so there is no board lane
      # to dispatch to and `ci:hardware` escalates to the same host lanes as
      # `ci:full`. Once such a runner exists, add its label to `boards` and
      # make this the conditional `all`/`hardware` the shared workflow takes.
      lanes: host
      # ARA-2 is Linux-only (NXP i.MX). libaraclient.so.1 has no macOS or
      # Windows build, so those lanes would test nothing.
      skip-macos: true
      skip-windows: true
      # The runner selection policy puts Full on the larger class: it runs
      # once per labelled PR rather than per push, so the spend is bounded by
      # review cadence. Quick, which does run per push, stays free.
      runner-class-linux: larger
      runner-class-linux-arm: larger
      nextest-args: --workspace --locked -E 'test(dvm_metadata)'
      env: PYO3_CROSS_PYTHON_VERSION=3.11
      # No `hack-args` here. rust-full gates the feature-combination lane on
      # `nightly`, so passing it to a pull-request Full run configures a job
      # that never starts. The powerset runs from nightly.yml; the
      # feature-enabled build gets PR-time cover from Quick's second clippy
      # pass above.
    secrets: inherit

  ci-gate:
    if: always()
    needs: [changes, quick, full]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    # Reads its own `needs` context and nothing else.
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")'
