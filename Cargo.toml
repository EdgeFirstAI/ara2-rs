[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/ara2"]

[workspace.package]
description = "Rust client library for the Kinara ARA-2 neural network accelerator on NXP i.MX platforms"
authors = ["Au-Zone Technologies <support@au-zone.com>"]
homepage = "https://edgefirst.ai"
repository = "https://github.com/EdgeFirstAI/ara2-rs"
readme = "README.md"
license = "Apache-2.0"
version = "0.14.0"
edition = "2024"

[workspace.dependencies]
ara2 = { version = "0.14.0", path = "crates/ara2" }
ara2-sys = { version = "0.14.0", path = "crates/ara2-sys" }
clap = { version = "4.6", features = ["derive"] }
criterion = "0.8"
edgefirst-hal = "0.27"
libcamera = "0.7"
wayland-client = { version = "0.31", default-features = false }
wayland-protocols = { version = "0.32", features = ["unstable", "client"] }
libloading = "0.9"
log = { version = "0.4", features = ["release_max_level_debug"] }
ndarray = { version = "0.17", features = ["rayon"] }
numpy = { version = "0.29", default-features = false }
pyo3 = "0.29"
pyo3-build-config = "0.29"

[profile.release]
opt-level = 3
lto = true
strip = true
debug = false

[profile.profiling]
inherits = "release"
strip = false
debug = true
