[package]
name = "ara2"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
readme.workspace = true
keywords = ["neural-network", "inference", "accelerator", "ara2", "edgefirst"]
categories = ["hardware-support", "science", "embedded"]
exclude = ["target/", "*.dvm", "*.onnx"]

[features]
# `From<edgefirst_codec::CodecError> for Error`, and the `Error::Codec`
# variant carrying it. Off by default: the client library never loads an
# image itself, so this exists only for callers that decode JPEGs or PNGs
# inside a function already returning `ara2::Error`.
codec = ["dep:edgefirst-codec"]

# Types `OutputSpec::dshape` as `edgefirst_decoder::configs::DimName` pairs
# instead of the metadata's raw axis-name strings, so a decoder
# configuration can be built straight from parsed DVM metadata. Off by
# default so reading metadata does not link a model decoder -- the default
# string form carries the same names (`"batch"`, `"num_boxes"`, ...) for
# callers that map them themselves, which is what the Python bindings do.
decoder = ["dep:edgefirst-decoder"]

# Enables the libcamera-based live-inference example (yolov8_live).
# Off by default so building the library and file-based examples does not
# require libcamera or Wayland client libraries on the host.
# `edgefirst-image/decode` supplies `ImageProcessor::draw_masks`, the fused
# decode+composite call the live example uses. It is off by default upstream
# so a build that only converts images does not link the model decoder.
camera = [
    "dep:libcamera",
    "dep:wayland-client",
    "dep:wayland-protocols",
    "decoder",
    "edgefirst-image/decode",
]

[dependencies]
ara2-sys.workspace = true
edgefirst-codec = { workspace = true, optional = true }
edgefirst-decoder = { workspace = true, optional = true }
# The workspace entry drops edgefirst-image's defaults, whose `codec` would
# otherwise pull edgefirst-codec into every build of this crate. `opengl` and
# `static` are the rest of that default set, re-listed so the GPU conversion
# engines and the statically linked tensor backend stay on.
edgefirst-image = { workspace = true, features = ["opengl", "static"] }
edgefirst-tensor.workspace = true
libcamera = { workspace = true, optional = true }
libloading.workspace = true
log.workspace = true
ndarray.workspace = true
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Proxy configuration files are YAML; `discover` and `Session::from_config`
# read the socket or TCP endpoint out of them.
serde_yaml_ng = "0.10"
wayland-client = { workspace = true, optional = true }
wayland-protocols = { workspace = true, optional = true }
zip = { version = "8.6", default-features = false }

[dev-dependencies]
clap.workspace = true
criterion.workspace = true
# The benches and the `yolov8` example load JPEGs straight into a tensor.
# A dev-dependency never propagates, so `cargo tree -e normal -p ara2` stays
# at edgefirst-tensor and edgefirst-image.
edgefirst-codec.workspace = true

[[bench]]
name = "model_benchmark"
harness = false

[[example]]
name = "test_dvm_metadata"
path = "../../examples/test_dvm_metadata.rs"

[[example]]
name = "yolov8"
path = "../../examples/yolov8.rs"
required-features = ["decoder"]

[[example]]
name = "yolov8_live"
path = "../../examples/yolov8_live.rs"
required-features = ["camera"]

[[example]]
name = "async_infer"
path = "../../examples/async_infer.rs"

[[example]]
name = "async_pipeline"
path = "../../examples/async_pipeline.rs"

[[example]]
name = "async_multi_model"
path = "../../examples/async_multi_model.rs"
